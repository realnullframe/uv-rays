<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blank Browser</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212; color: #ffffff; margin: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;
        }
        .container { text-align: center; width: 100%; max-width: 500px; padding: 20px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; font-weight: 700; letter-spacing: -0.05em; }
        p { color: #888888; margin-bottom: 30px; }
        .search-box { display: flex; gap: 10px; width: 100%; background: #1e1e1e; padding: 8px; border-radius: 12px; border: 1px solid #333333; }
        input { flex: 1; background: transparent; border: none; color: #ffffff; font-size: 1rem; padding: 8px 12px; outline: none; }
        button { background-color: #ffffff; color: #000000; border: none; padding: 8px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        #status { margin-top: 20px; font-size: 0.85rem; color: #00ca4e; min-height: 20px; }
    </style>
    <!-- Relative paths work perfectly now because they are on the same server! -->
    <script src="/uv/uv.config.js"></script>
    <script src="/uv/uv.bundle.js"></script>
</head>
<body>
    <div class="container">
        <h1>Blank Browser</h1>
        <p>Chromebook Edition</p>
        <div class="search-box">
            <input type="text" id="url" placeholder="Enter a website URL (e.g., google.com)">
            <button id="open">OPEN</button>
        </div>
        <div id="status">Ready.</div>
    </div>
    <script>
        const input = document.getElementById("url");
        const button = document.getElementById("open");
        const status = document.getElementById("status");

        function openWebsite() {
            let url = input.value.trim();
            if (!url) return;
            if (!/^https?:\/\//i.test(url)) url = "https://" + url;

            const tab = window.open("about:blank", "_blank");
            if (!tab) { status.textContent = "Popup blocked!"; return; }

            const proxyUrl = window.location.origin + __uv$config.prefix + __uv$config.encodeUrl(url);
            
            const iframe = tab.document.createElement("iframe");
            iframe.src = proxyUrl;
            iframe.style.cssText = "position:fixed; inset:0; width:100%; height:100%; border:none; margin:0; padding:0;";
            
            tab.document.body.style.margin = "0";
            tab.document.body.appendChild(iframe);
            tab.document.title = "about:blank";
        }

        button.addEventListener("click", openWebsite);
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") openWebsite(); });
    </script>
</body>
</html>
